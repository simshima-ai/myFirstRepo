<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-CAD</title>
<meta name="description" content="S-CAD language routing page.">
<script>
(function () {
  var KEY = "scad-site-lang";
  var stored = "";
  try { stored = String(localStorage.getItem(KEY) || "").toLowerCase(); } catch (_) {}
  var nav = "";
  try { nav = String((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase(); } catch (_) {}
  var isJa = stored ? stored === "ja" : nav.indexOf("ja") === 0;
  var target = isJa ? "./index_ja.html" : "./index_en.html";
  location.replace(target);
})();
</script>
</head>
<body></body>
</html>
