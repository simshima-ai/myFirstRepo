<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-CAD - Simple 2D CAD Tool</title>
<meta name="description" content="S-CAD is a free browser-based 2D CAD tool. No installation required. Import DXF and SVG, and create drawings directly in your browser.">
<link rel="stylesheet" href="./site.css">
<style>
body { justify-content: unset; align-items: unset; }

.home-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: calc(100vh - 56px - 73px);
  padding: 60px 24px;
}

.home-hero h1 {
  font-size: clamp(48px, 10vw, 96px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 16px;
}

.home-hero h1 span { color: #00aadd; }

.tagline {
  font-size: 16px;
  color: #888;
  margin-bottom: 48px;
  letter-spacing: 0.04em;
}

.btn-open {
  display: inline-block;
  padding: 16px 40px;
  background: #00aadd;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 2px;
  transition: background 0.2s, transform 0.15s;
}

.btn-open:hover { background: #0088bb; transform: translateY(-1px); }

.sub-links {
  margin-top: 32px;
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}

.sub-links a {
  font-size: 12px;
  color: #555;
  text-decoration: none;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: color 0.2s;
}

.sub-links a:hover { color: #aaa; }

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  margin-right: 12px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.lang-switch a {
  color: #777;
  text-decoration: none;
}

.lang-switch a.active {
  color: #fff;
}

.lang-switch .sep {
  color: #555;
}
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="./index.html"><span>S-</span>CAD</a>
  <ul class="nav-links">
    <li><a href="./tutorial_en.html">Tutorial</a></li>
    <li><a href="./about_en.html">About</a></li>
    <li><a href="./contact_en.html">Contact</a></li>
  </ul>
  <div class="lang-switch" aria-label="Language switch">
    <a href="./index_ja.html" lang="ja" data-site-lang="ja">JP</a>
    <span class="sep">/</span>
    <a href="./index_en.html" class="active" lang="en" data-site-lang="en">EN</a>
  </div>
  <a href="./cad.html" class="nav-cta">Open App</a>
</nav>

<main>
  <div class="home-hero">
    <h1><span>S-</span>CAD</h1>
    <p class="tagline">Simple &amp; Smart 2D CAD</p>
    <a href="./cad.html" class="btn-open">Open App</a>
    <div class="sub-links">
      <a href="./tutorial_en.html">Tutorial</a>
      <a href="./manual_en.html">Manual</a>
      <a href="./about_en.html">About</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <span class="footer-copy">&copy; 2026 S-CAD</span>
  <nav class="footer-links">
    <a href="./privacy_en.html">Privacy Policy</a>
    <a href="./contact_en.html">Contact</a>
    <a href="./about_en.html">About</a>
  </nav>
</footer>

<script>
(function () {
  var KEY = "scad-site-lang";
  document.querySelectorAll("[data-site-lang]").forEach(function (el) {
    el.addEventListener("click", function () {
      try { localStorage.setItem(KEY, String(el.getAttribute("data-site-lang") || "")); } catch (_) {}
    });
  });
})();
</script>

</body>
</html>
